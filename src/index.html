<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AngularPlaygroundV1</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <!--
      Material Symbols is a separate variable font from the Material Icons
      family mat-icon loads, so it needs its own request. `display=block`
      rather than swap: these are ligature glyphs, and swap would paint the
      literal word "timer" until the font arrived.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
      rel="stylesheet"
    />
    <script>
      // GitHub Pages serves 404.html for unknown paths. It redirects here with the
      // original path in ?redirect=, so restore it into the address bar before
      // Angular bootstraps and reads the initial route.
      (function () {
        var redirect = new URLSearchParams(window.location.search).get('redirect');
        if (redirect) {
          window.history.replaceState({}, '', redirect);
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
