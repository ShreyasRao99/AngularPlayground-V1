<section class="p-6">
  <h1 class="text-2xl font-semibold text-center mb-6">HTML Questions</h1>

  <mat-accordion>
    @for (faq of faqs; track faq.id) {
      <mat-expansion-panel>
        <mat-expansion-panel-header>
          <mat-panel-title>{{ faq.question }}</mat-panel-title>
        </mat-expansion-panel-header>
        <p class="answer">{{ faq.answer }}</p>
      </mat-expansion-panel>
    }
  </mat-accordion>
</section>
