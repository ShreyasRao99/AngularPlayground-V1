<mat-accordion>
  @for (faq of faqs(); track faq.id) {
    <mat-expansion-panel>
      <mat-expansion-panel-header>
        <mat-panel-title>
          <span
            class="mr-2 tabular-nums text-[color:var(--mat-sys-primary)]"
          >{{ $index + 1 }}.</span>
          {{ faq.question }}
        </mat-panel-title>
      </mat-expansion-panel-header>

      <p
        class="mx-4 mb-2 leading-relaxed text-[color:var(--mat-sys-on-surface-variant)]"
      >
        {{ faq.answer }}
      </p>

      @if (faq.examples.length) {
        <section class="mx-4 mb-4 flex flex-col gap-4">
          @for (example of faq.examples; track example.title) {
            <div>
              <h3
                class="mb-2 text-sm font-semibold text-[color:var(--mat-sys-on-surface)]"
              >
                {{ example.title }}
              </h3>
              <pre
                class="m-0 overflow-x-auto rounded-lg bg-[color:var(--mat-sys-surface-container-high)] p-3 font-mono text-[0.85rem] leading-relaxed text-[color:var(--mat-sys-on-surface)]"
              ><code>{{ example.code }}</code></pre>
              <p
                class="mt-2 text-sm leading-relaxed text-[color:var(--mat-sys-on-surface-variant)]"
              >
                {{ example.explanation }}
              </p>
            </div>
          }
        </section>
      }
    </mat-expansion-panel>
  }
</mat-accordion>
