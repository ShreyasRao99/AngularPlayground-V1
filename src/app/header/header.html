<mat-toolbar class="justify-between align-middle">
  <div class="flex items-center">
    <button
      mat-icon-button
      aria-label="Toggle navigation menu"
      [matMenuTriggerFor]="menu"
      class="md:hidden!"
    >
      <mat-icon class="text-white!">menu</mat-icon>
    </button>
    <div class="align-center justify-center">Angular Playground V1</div>
  </div>

  <div class="hidden md:flex text-lg gap-5">
    <a
      class="text-white no-underline hover:underline"
      [href]="feedbackMailto"
      (click)="openFeedback($event)"
      >Suggestion/Feedback</a
    >
  </div>
</mat-toolbar>
<mat-menu #menu="matMenu">
  <button
    mat-menu-item
    (click)="openFeedback($event)"
    >Suggestion/Feedback</button
  >
</mat-menu>
