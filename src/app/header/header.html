<mat-toolbar class="justify-between align-middle">
  <div class="flex items-center">
    <button
      mat-icon-button
      aria-label="Toggle navigation menu"
      [matMenuTriggerFor]="menu"
      class="md:hidden!"
    >
      <mat-icon class="text-white!">menu</mat-icon>
    </button>
    <div class="align-center justify-center">Angular Playground V1</div>
  </div>

  <div class="flex items-center">
    <!--
      Outside the nav below rather than inside it: those links are hidden on a
      phone, but backup is two icons wide and worth having on every screen size.
    -->
    <app-backup-actions />

    <div class="hidden md:flex text-lg gap-5">
      <a
        class="text-white no-underline hover:underline"
        [href]="feedbackMailto"
        (click)="openFeedback($event)"
        >Suggestion/Feedback</a
      >
    </div>
  </div>
</mat-toolbar>
<mat-menu #menu="matMenu">
  <button
    mat-menu-item
    (click)="openFeedback($event)"
    >Suggestion/Feedback</button
  >
</mat-menu>
