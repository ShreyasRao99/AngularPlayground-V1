<nav mat-tab-nav-bar [tabPanel]="tabPanel">
  @for (link of links; track link.route) {
    <a
      mat-tab-link
      [routerLink]="link.route"
      routerLinkActive
      #rla="routerLinkActive"
      [active]="rla.isActive"
    >
      {{ link.label }}
    </a>
  }
</nav>
<mat-tab-nav-panel #tabPanel></mat-tab-nav-panel>
